<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain-Sync</title>
    <style>
        body {
            font-family: ui-monospace, Menlo, monospace;
            margin: 0;
            padding: 12px;
            width: 360px;
            background: #f7f8f4;
            color: #1b1f1c;
        }
        h1 { font-size: 14px; margin: 0 0 2px; }
        .sub { font-size: 10px; opacity: .6; margin-bottom: 8px; }
        #query {
            width: 100%; padding: 8px; box-sizing: border-box;
            border: 1px solid #bbb; border-radius: 8px; font: inherit;
        }
        .row { display: flex; gap: 8px; margin-top: 8px; }
        button {
            flex: 1; padding: 8px; cursor: pointer; border-radius: 8px;
            border: 1px solid #333; background: #fff; font: inherit; font-size: 12px;
        }
        button:disabled { opacity: .5; cursor: default; }
        button.primary { background: #1b1f1c; color: #f7f8f4; border-color: #1b1f1c; }
        button.danger { border-color: #b33; color: #b33; }
        .tiny { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tiny input {
            width: 100%; box-sizing: border-box; padding: 6px;
            border: 1px solid #bbb; border-radius: 8px; font: inherit; font-size: 11px;
        }
        #stats { margin-top: 8px; font-size: 11px; opacity: .75; }
        #notice { margin-top: 6px; font-size: 11px; min-height: 14px; color: #1b7f4b; }
        #notice.bad { color: #b33; }
        #recent, #domains {
            margin-top: 8px; font-size: 11px; max-height: 84px; overflow: auto;
            border-top: 1px dashed #bbb; padding-top: 6px;
        }
        #results { margin-top: 8px; font-size: 12px; max-height: 320px; overflow: auto; }
        .hit { padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px dashed #bbb; }
        .hit .score { opacity: .6; }
        .hit .snip { margin: 4px 0; }
        .hit .acts { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        .hit .acts button { flex: none; padding: 3px 8px; font-size: 11px; }
        mark { background: #fff176; color: #000; padding: 0 2px; border-radius: 2px; }
        a { color: #1b5fbf; }
    </style>
</head>
<body>
    <h1>Brain-Sync</h1>
    <div class="sub" id="stats">checking vault...</div>

    <input id="query" type="text" placeholder="search what you clipped..." />
    <div class="row">
        <button id="clipBtn" class="primary">Clip this page</button>
        <button id="searchBtn">Search</button>
    </div>

    <div class="tiny">
        <input id="domainFilter" type="text" placeholder="domain filter" />
        <input id="minScore" type="number" step="0.01" placeholder="min score" />
    </div>

    <div id="notice"></div>

    <div class="row">
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
        <button id="clearBtn" class="danger">Wipe vault</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none" />

    <div id="recent">no clips yet</div>
    <div id="domains"></div>
    <div id="results">type something and hit search</div>

    <script type="module" src="popup.js"></script>
</body>
</html>
